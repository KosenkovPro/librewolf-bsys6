name: Docker Image

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target image'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - windows
          - macos
          - dind
          - release
      version:
        description: 'Version of the source archive, defaults to the latest source release'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build-image:
    # The images hold the whole Firefox source tree, they need a lot of disk.
    # Set the repository variable BUILD_RUNNER_JSON to a bigger runner if the
    # default one is too small.
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # A single target can be built with the input, otherwise all of them.
        target: ${{ fromJSON(inputs.target != '' && format('["{0}"]', inputs.target) || '["linux","windows","macos","dind","release"]') }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image name and the source version
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          SOURCE_OWNER: ${{ vars.GHCR_OWNER || 'kosenkovpro' }}
        run: |
          set -euo pipefail

          echo "image=ghcr.io/$SOURCE_OWNER/bsys6" >> "$GITHUB_OUTPUT"

          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$(gh api "repos/$SOURCE_OWNER/librewolf-source/releases/latest" --jq .tag_name 2>/dev/null || true)"
          fi

          if [ -z "$version" ]; then
            echo "::error::No source release was found in $SOURCE_OWNER/librewolf-source. Run the 'Create Source Code Release' workflow of the source repository first."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_url=https://github.com/$SOURCE_OWNER/librewolf-source/releases/download/$version/librewolf-$version.source.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: assets/Dockerfile.${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ matrix.target }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            SOURCE_URL=${{ steps.meta.outputs.source_url }}
            FORGE_URL=https://github.com
            FORGE_REPO_OWNER=${{ vars.GHCR_OWNER || 'kosenkovpro' }}
