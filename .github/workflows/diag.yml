name: Diagnose the container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  wine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/kosenkovpro/bsys6:windows
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      WINEPREFIX: /root/.wine
    steps:
      - name: Inspect the system
        run: |
          uname -a
          timeout 30 /root/.mozbuild/wine/bin/wine --version 2>&1 | head -3
          docker version --format '{{.Server.APIVersion}}' 2>&1 | head -2

      - name: Run wine
        run: |
          echo "--- wine cmd ---"
          timeout 60 /root/.mozbuild/wine/bin/wine cmd /c echo hello > /tmp/wine.log 2>&1
          echo "exit=$?"
          cat /tmp/wine.log | head -20

      - name: Compile a shader
        run: |
          cd /tmp
          printf 'float4 LayerQuadVS(float4 aPosition : POSITION) : POSITION { return aPosition; }\n' > t.hlsl
          echo "--- fxc2 with native d3dcompiler ---"
          WINEDLLOVERRIDES=d3dcompiler_47=n timeout 120 /root/.mozbuild/wine/bin/wine /root/.mozbuild/fxc2/bin/fxc2.exe -nologo -Tvs_4_0_level_9_3 t.hlsl -ELayerQuadVS -VnLayerQuadVS -Vi -DVERTEX_SHADER -Fhout.h > /tmp/fxc.log 2>&1
          echo "exit=$?"
          cat /tmp/fxc.log | head -20
          ls -l out.h 2>&1
