name: Diagnose the container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/kosenkovpro/bsys6:windows
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      WINEPREFIX: /root/.wine
    steps:
      - name: Inspect the system
        run: |
          echo "--- uname ---"
          uname -a
          echo "--- os ---"
          cat /etc/os-release | head -3
          echo "--- architecture ---"
          dpkg --print-architecture
          dpkg --print-foreign-architectures
          echo "--- 32 bit support ---"
          ls /lib/ld-linux.so.2 /lib32 2>&1 | head -5
          echo "--- wine version ---"
          timeout 30 /root/.mozbuild/wine/bin/wine --version 2>&1 | head -3
          echo "exit=$?"
          echo "--- wine file ---"
          file /root/.mozbuild/wine/bin/wine* 2>&1 | head -5
          echo "--- python unix socket ---"
          python3 -c "import socket; s=socket.socket(socket.AF_UNIX); print('unix socket ok')" 2>&1
          echo "--- python socketpair ---"
          python3 -c "import socket; a,b=socket.socketpair(); print('socketpair ok')" 2>&1
          echo "--- tmp ---"
          ls -ld /tmp /root /root/.wine 2>&1
          echo "--- whoami / HOME ---"
          id
          echo "HOME=$HOME"
          echo "--- limits ---"
          cat /proc/sys/kernel/threads-max 2>&1
          ulimit -a

  wine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/kosenkovpro/bsys6:windows
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      WINEPREFIX: /root/.wine
    steps:
      - name: Run wine
        run: |
          echo "--- wine cmd (60s timeout) ---"
          timeout 60 /root/.mozbuild/wine/bin/wine cmd /c echo hello 2>&1 | head -30
          echo "exit=$?"
          echo "--- prefix content ---"
          ls -la /root/.wine 2>&1 | head -20
          echo "--- wine processes ---"
          ps aux | head -20
