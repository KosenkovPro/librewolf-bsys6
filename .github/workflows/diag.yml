name: Diagnose the container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  swap:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/kosenkovpro/bsys6:linux
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --privileged
    steps:
      - name: Inspect the memory
        run: |
          echo "--- memory ---"
          grep -E "MemTotal|MemAvailable|SwapTotal" /proc/meminfo
          echo "--- capabilities ---"
          grep CapEff /proc/self/status
          echo "--- filesystem of the workspace ---"
          df -hT "$GITHUB_WORKSPACE" /tmp

      - name: Add swap space
        run: |
          set -x
          swapfile="$GITHUB_WORKSPACE/swapfile"
          fallocate -l 8G "$swapfile" || dd if=/dev/zero of="$swapfile" bs=1M count=8192 status=none
          chmod 600 "$swapfile"
          mkswap "$swapfile"
          swapon "$swapfile" && echo "SWAP ENABLED"
          grep -E "MemTotal|MemAvailable|SwapTotal|SwapFree" /proc/meminfo
          swapon --show
