name: Diagnose the container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  diag:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/kosenkovpro/bsys6:linux
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - name: Inspect the default working directory
        run: |
          echo "PWD=$(pwd)"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-unset}"
          echo "HOME=$HOME"
          echo "--- ls /__w ---"
          ls -la /__w/ 2>&1 || true
          echo "--- ls . ---"
          ls -la . 2>&1 | head -20
          echo "--- git ---"
          git rev-parse --show-toplevel 2>&1 || true
          echo "--- tools ---"
          command -v git || true
          command -v git-lfs || echo "no git-lfs binary"

      - name: Inspect the workspace path
        working-directory: /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
        run: |
          echo "PWD=$(pwd)"
          ls -la . 2>&1 | head -20
          git rev-parse --show-toplevel 2>&1 || true
          git lfs env 2>&1 | head -5 || true
