when:
  evaluate: |
    CI_PIPELINE_EVENT in ["manual"]

workspace:
  base: /woodpecker
  path: src/codeberg.org/librewolf/bsys6

steps:
  source:
    image: codeberg.org/librewolf/bsys6/linux:latest
    commands:
      - WORKDIR=/woodpecker/work ./bsys6 source

  build:
    image: codeberg.org/librewolf/bsys6/linux:latest
    commands:
      - WORKDIR=/woodpecker/work ./bsys6 build

  package:
    image: codeberg.org/librewolf/bsys6/linux:latest
    commands:
      - WORKDIR=/woodpecker/work ./bsys6 package

  deb:
    image: codeberg.org/librewolf/bsys6/linux:latest
    commands:
      - WORKDIR=/woodpecker/work ./bsys6 deb

  rpm:
    image: codeberg.org/librewolf/bsys6/linux:latest
    commands:
      - WORKDIR=/woodpecker/work ./bsys6 rpm

