when:
  evaluate: |
    CI_PIPELINE_EVENT in ["manual"]
    and (WORKFLOW == "images")

# workspace:
#   base: /root
#   path: src/codeberg.org/librewolf/bsys6

matrix:
  TARGET:
    - dind
    - linux
    - macos
    - windows

steps:
  login:
    image: codeberg.org/librewolf/bsys6/dind
    secrets: [codeberg_user, codeberg_access_token]
    commands:
      - docker login -u $CODEBERG_USER -p $CODEBERG_ACCESS_TOKEN codeberg.org
  build-and-push:
    image: codeberg.org/librewolf/bsys6/dind
    privileged: true
    commands:
      - dockerd --exec-root /root/docker & sleep 1
      - ./bsys6 build_image
      - docker push codeberg.org/librewolf/bsys6/$TARGET:latest
      - killall -INT dockerd && sleep 1
