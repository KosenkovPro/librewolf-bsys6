name: Cleanup Artifacts

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: tiny
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install s3cmd
        run: |
          if ! command -v s3cmd >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends install s3cmd
          fi

      - name: Delete old artifacts
        env:
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ARTIFACTS_BUCKET: ${{ vars.S3_ARTIFACTS_BUCKET }}
          S3_ARTIFACTS_PUBLIC_URL: ${{ vars.S3_ARTIFACTS_PUBLIC_URL }}
          S3_KEY: ${{ secrets.S3_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
        run: ./bsys6 cleanup_artifacts
